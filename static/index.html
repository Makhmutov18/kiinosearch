<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Кино-Лаборатория</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header id="header">
      <h1 class="logo">🎬 Кино-Лаборатория</h1>
      <nav id="tabs">
        <button class="tab active" data-mode="random">🎲 Случайный</button>
        <button class="tab" data-mode="TOP_250_MOVIES">👑 Топ-250</button>
        <button class="tab" data-mode="TOP_POPULAR_MOVIES">🔥 Тренды</button>
        <button class="tab" data-mode="genres">🎭 Жанры</button>
      </nav>
      <div id="genres-panel" class="genres-panel hidden">
        <button class="genre-tag" data-id="2">🎭 Драма</button>
        <button class="genre-tag" data-id="6">👽 Фантастика</button>
        <button class="genre-tag" data-id="1">🔪 Триллер</button>
        <button class="genre-tag" data-id="13">😂 Комедия</button>
        <button class="genre-tag" data-id="11">💥 Боевик</button>
      </div>
    </header>

    <!-- Loader -->
    <div id="loader" class="loader hidden">
      <div class="spinner"></div>
      <p>Загружаем фильм...</p>
    </div>

    <!-- Movie Card -->
    <main id="movie-card" class="movie-card hidden">
      <div class="poster-wrapper">
        <img id="poster" src="" alt="Poster" />
        <div id="rating-badge" class="rating-badge"></div>
      </div>
      <div class="info">
        <h2 id="title"></h2>
        <div class="meta">
          <span id="year"></span>
          <span id="genres"></span>
        </div>
        <p id="description" class="description collapsed">
          <span id="desc-text"></span>
          <button id="desc-toggle" class="desc-toggle">Читать далее</button>
        </p>
      </div>
    </main>

    <!-- Error -->
    <div id="error" class="error hidden">
      <p>😔 Не удалось загрузить фильм. Попробуйте ещё раз.</p>
      <button id="retry-btn" class="retry-btn">Повторить</button>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
